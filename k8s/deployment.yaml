apiVersion: apps/v1
kind: Deployment
metadata:
  name: ir-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ir-api
  template:
    metadata:
      labels:
        app: ir-api
    spec:
      containers:
        - name: ir-api
          image: incident-response-lab:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000